    </radialGradient>
    <linearGradient id="heat" x1="10" y1="50" x2="50" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".35"/><stop offset=".55" stop-color="#ff783b"/>
      <stop offset="1" stop-color="#fff0df"/>
